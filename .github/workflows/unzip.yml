name: Unzip Project
on:
  workflow_dispatch:
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit extracted files
        run: |
          unzip -o TradingJournal-Android-v1.zip
          cp -a android-trading-journal/. .
          rm -rf android-trading-journal TradingJournal-Android-v1.zip
          echo "=== build-apk.yml ==="
          cat .github/workflows/build-apk.yml
          echo "=== end build-apk.yml ==="
          rm .github/workflows/build-apk.yml
          git config user.name "muse-bot"
          git config user.email "muse-bot@users.noreply.github.com"
          git add -A
          git commit -m "Extract project files" || echo "nothing to commit"
          git push
